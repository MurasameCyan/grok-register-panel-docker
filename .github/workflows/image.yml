name: image

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if requirements.txt is unchanged"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"
  push:
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/image.yml

concurrency:
  group: image
  cancel-in-progress: false

env:
  UPSTREAM_REPO_SLUG: lij768423-svg/grok-register-panel
  UPSTREAM_REF: main
  # GHCR rejects uppercase paths and this owner has capitals, so the repo name
  # cannot be used verbatim -- keep this literal and lowercase.
  IMAGE: ghcr.io/murasamecyan/grok-register-panel-docker

jobs:
  # Cheap API-only probe: resolve upstream HEAD and hash its requirements.txt,
  # then compare against the published image's label. Source-only commits need
  # no image at all -- the entrypoint git-pulls them at container start.
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      rev: ${{ steps.up.outputs.rev }}
      reqs_sha: ${{ steps.up.outputs.reqs_sha }}
      needs_build: ${{ steps.decide.outputs.needs_build }}
    steps:
      - name: Resolve upstream revision and dependency hash
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rev="$(gh api "repos/$UPSTREAM_REPO_SLUG/commits/$UPSTREAM_REF" --jq .sha)"
          gh api "repos/$UPSTREAM_REPO_SLUG/contents/requirements.txt?ref=$rev" \
            --jq .content | base64 -d > reqs.txt
          reqs_sha="$(sha256sum reqs.txt | cut -d' ' -f1)"
          echo "rev=$rev"           >> "$GITHUB_OUTPUT"
          echo "reqs_sha=$reqs_sha" >> "$GITHUB_OUTPUT"
          echo "upstream $rev / reqs $reqs_sha" >> "$GITHUB_STEP_SUMMARY"

      # imagetools needs a registry login even for public reads on GHCR.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare against published image
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ steps.up.outputs.reqs_sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "reason: ${{ github.event_name }} (forced)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          have="$(docker buildx imagetools inspect "$IMAGE:latest" --format \
                    '{{ index .Image.Config.Labels "io.grokpanel.reqs-sha256" }}' \
                    2>/dev/null || true)"
          if [ "$have" = "$WANT" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "deps unchanged, skipping build (restart your container to get source)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "deps changed: $have -> $WANT" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: probe
    if: needs.probe.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # arm64 layers are built under emulation on the amd64 runner. Only the
      # image build needs this; the container runs natively on real hardware.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=reqs-${{ needs.probe.outputs.reqs_sha }}
            type=sha,format=long,prefix=upstream-,value=${{ needs.probe.outputs.rev }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Both arches: Camoufox publishes lin.arm64 and lin.x86_64 Firefox
          # builds, so `camoufox fetch` resolves natively on each platform.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UPSTREAM_REF=${{ env.UPSTREAM_REF }}
            UPSTREAM_REV=${{ needs.probe.outputs.rev }}
            REQS_SHA256=${{ needs.probe.outputs.reqs_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Verify both arches are published and can self-check
        env:
          TAG: ${{ env.IMAGE }}:reqs-${{ needs.probe.outputs.reqs_sha }}
        run: |
          set -euo pipefail
          got="$(docker buildx imagetools inspect "$TAG" --format \
                   '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
          echo "published platforms: $got"
          for want in linux/amd64 linux/arm64; do
            case "$got" in *"$want"*) ;; *) echo "missing $want" >&2; exit 1 ;; esac
          done
          # arm64 runs under QEMU, so it is slow but exercises the same paths.
          for plat in linux/amd64 linux/arm64; do
            echo "--- smoke $plat ---"
            docker run --rm --platform "$plat" --shm-size=1g \
              -e UPSTREAM_AUTO_UPDATE=0 -e MONITOR_HOST=127.0.0.1 \
              "$TAG" smoke.sh
          done

          # The bug this image kept hitting: Docker creates a missing bind-mount
          # source as root:root, so mount root-owned dirs and require the
          # entrypoint to chown them and still land on uid 10001. smoke.sh's own
          # writability checks are what would fail if the fix regressed.
          # --platform is explicit from here on: the arch loop above left arm64 as
          # the locally-resolved image for $TAG, and everything below would
          # otherwise run under QEMU for no reason.
          echo "--- root-owned bind mounts are adopted ---"
          host="$(mktemp -d)"
          sudo mkdir -p "$host"/panel "$host"/log "$host"/accounts \
                        "$host"/cpa_auth "$host"/grok2api_auth
          sudo chown -R 0:0 "$host"
          docker run --rm --shm-size=1g --platform linux/amd64 \
            -e UPSTREAM_AUTO_UPDATE=0 -e MONITOR_HOST=127.0.0.1 \
            -v "$host/panel":/app/src/panel-data \
            -v "$host/log":/app/src/log \
            -v "$host/accounts":/app/src/accounts \
            -v "$host/cpa_auth":/app/src/cpa_auth \
            -v "$host/grok2api_auth":/app/src/grok2api_auth \
            "$TAG" smoke.sh
          # config.json must exist on the HOST side afterwards, proving the
          # entrypoint wrote through the mount rather than into the image layer.
          sudo test -f "$host/panel/config.json" \
            || { echo "entrypoint did not create config.json in the mount" >&2; exit 1; }
          echo "host-side owner: $(sudo stat -c '%u:%g' "$host/panel/config.json")"

          # Opting out must still fail loudly instead of starting half-broken.
          # A SECOND temp dir, not $host: the run above already chowned that one
          # to 10001:10001, so reusing it makes this assertion pass for the wrong
          # reason -- which is exactly how it broke once.
          echo "--- PANEL_FIX_OWNERSHIP=0 refuses root-owned mounts ---"
          optout="$(mktemp -d)"
          sudo mkdir -p "$optout/log"
          sudo chown -R 0:0 "$optout"
          if docker run --rm --shm-size=1g --platform linux/amd64 \
               -e UPSTREAM_AUTO_UPDATE=0 -e MONITOR_HOST=127.0.0.1 \
               -e PANEL_FIX_OWNERSHIP=0 \
               -v "$optout/log":/app/src/log \
               "$TAG" smoke.sh 2>&1 | tee /tmp/optout.log; then
            echo "expected a non-zero exit with PANEL_FIX_OWNERSHIP=0" >&2; exit 1
          fi
          grep -q 'not writable by uid' /tmp/optout.log \
            || { echo "opt-out failed without naming the unwritable mounts" >&2; exit 1; }
          sudo rm -rf "$host" "$optout"

          # A user who keeps an old docker-compose.yml gets single-file mounts,
          # which Docker materialises as root-owned dirs when ./data is gone.
          # Nothing in the container can unmount those, so the only correct
          # behaviour is to name the stale compose file instead of dying on `ln`.
          echo "--- a stale single-file mount is diagnosed, not retried ---"
          legacy="$(mktemp -d)"
          sudo mkdir -p "$legacy/config.json" "$legacy/proxies.txt"
          sudo chown -R 0:0 "$legacy"
          if docker run --rm --shm-size=1g --platform linux/amd64 \
               -e UPSTREAM_AUTO_UPDATE=0 -e MONITOR_HOST=127.0.0.1 \
               -v "$legacy/config.json":/app/src/config.json \
               -v "$legacy/proxies.txt":/app/src/proxies.txt \
               "$TAG" smoke.sh 2>&1 | tee /tmp/legacy.log; then
            echo "expected a non-zero exit with legacy single-file mounts" >&2; exit 1
          fi
          grep -q 'docker-compose.yml predates this image' /tmp/legacy.log \
            || { echo "did not identify the stale compose file" >&2; exit 1; }
          # `if`, not `grep ... && { exit 1; }`: a non-match is the PASS case here,
          # and as the last element of an && list its exit 1 would trip set -e.
          if grep -q 'failed to create symbolic link' /tmp/legacy.log; then
            echo "still dying on ln instead of diagnosing the mount" >&2; exit 1
          fi
          sudo rm -rf "$legacy"

          # The promise this image makes: pull and `up -d` with nothing prepared
          # on the host -- no mkdir, no chown, no .env, no token.
          echo "--- compose up with nothing prepared ---"
          fresh="$(mktemp -d)"
          cp docker-compose.yml "$fresh/"
          cd "$fresh"
          IMAGE_TAG="reqs-${{ needs.probe.outputs.reqs_sha }}" \
            docker compose up -d --wait --wait-timeout 180
          # --wait gates on the HEALTHCHECK, so reaching here means the panel is
          # actually serving /api/health, not merely that the process started.
          test -z "$(docker compose ps --status exited -q)" \
            || { docker compose logs; echo "a container exited" >&2; exit 1; }

          token="$(docker compose exec -T panel cat panel-data/monitor_token | tr -d '\r\n')"
          printf '%s' "$token" | grep -Eq '^[0-9a-f]{64}$' \
            || { docker compose logs; echo "not a 64-hex token: '$token'" >&2; exit 1; }
          echo "generated a 64-hex token (${#token} chars)"

          # Unauthenticated must be refused, and the generated token accepted --
          # otherwise "no .env needed" would mean "no auth needed".
          code="$(docker compose exec -T panel curl -so /dev/null -w '%{http_code}' \
                    http://127.0.0.1:8787/api/status)"
          [ "$code" = 401 ] || { echo "unauthenticated /api/status gave $code, want 401" >&2; exit 1; }
          code="$(docker compose exec -T panel curl -so /dev/null -w '%{http_code}' \
                    -H "Authorization: Bearer $token" http://127.0.0.1:8787/api/status)"
          [ "$code" = 200 ] || { echo "token-authenticated /api/status gave $code, want 200" >&2; exit 1; }
          echo "401 without the token, 200 with it"

          # The token must survive a recreate, or every `pull` would lock the
          # user out of their own panel.
          docker compose down
          IMAGE_TAG="reqs-${{ needs.probe.outputs.reqs_sha }}" \
            docker compose up -d --wait --wait-timeout 180
          again="$(docker compose exec -T panel cat panel-data/monitor_token)"
          [ "$again" = "$token" ] \
            || { echo "token changed across recreate: $token -> $again" >&2; exit 1; }
          echo "token survived down/up"

          # check-update.sh must not cry "pull" at a container that is already on
          # the image we just pushed. Its ref-splitting is the part that would
          # silently query the wrong repo, so run its self-check too.
          echo "--- check-update.sh does not false-positive on a fresh image ---"
          "$GITHUB_WORKSPACE/docker/check-update.sh" --self-check
          rc=0
          # IMAGE_TAG must be passed: compose resolves ${IMAGE_TAG:-latest} when
          # reading the file, so without it the script would ask the registry
          # about `latest` while the stack is actually running reqs-<sha>.
          GITHUB_TOKEN=${{ github.token }} \
          IMAGE_TAG="reqs-${{ needs.probe.outputs.reqs_sha }}" \
            "$GITHUB_WORKSPACE/docker/check-update.sh" > /tmp/cu.log 2>&1 || rc=$?
          cat /tmp/cu.log
          # Only the image half is asserted. The upstream half may legitimately
          # say "pull" if upstream lands a requirements.txt change between this
          # build and this check -- a real race, and not this script's bug.
          if grep -q 'image moved' /tmp/cu.log; then
            echo "reported a stale image right after pulling it" >&2; exit 1
          fi
          # 0 up-to-date, 10 pull, 11 restart. 2 is a hard error (missing dep,
          # container unreachable, unparseable API response) and must not pass.
          case "$rc" in
            0|10|11) echo "check-update.sh exited $rc" ;;
            *) echo "check-update.sh failed with $rc" >&2; exit 1 ;;
          esac

          # Every ${VAR:-default} in compose must actually reach the process, and
          # the state-file paths must land inside a mounted directory. An empty
          # value would resolve to "." -- i.e. /app/src, which the entrypoint's
          # `git reset --hard` wipes -- so a typo'd default silently loses data.
          echo "--- state paths resolve inside the mounts ---"
          for pair in \
            "CPA_AUTH_DIR /app/src/cpa_auth" \
            "EMAIL_PROVIDER_CONFIG_FILE /app/src/panel-data/config.json" \
            "PROXY_POOL_STATE_FILE /app/src/log/proxy_pool.json" \
            "PROXY_POOL_LEGACY_FILE /app/src/panel-data/proxies.txt" \
            "BLACKLIST_STATE_FILE /app/src/log/blacklist_state.json" \
            "EMAIL_DOMAIN_POOL_STATE_FILE /app/src/log/email_domain_pool.json" \
            "GROK_USE_XVFB auto"; do
            var="${pair%% *}"; want="${pair##* }"
            got="$(docker compose exec -T panel printenv "$var" | tr -d '\r\n')"
            [ "$got" = "$want" ] \
              || { echo "$var is '$got', want '$want'" >&2; exit 1; }
          done
          echo "all state paths match their compose defaults"

          # Upstream resolves these at import time, so ask upstream itself
          # instead of trusting that the env var and the module agree. This is
          # one logical Python line: a heredoc or a real multi-line -c string
          # would have to start at column 0, which breaks out of this YAML block
          # scalar, and indenting it instead gives Python an IndentationError.
          # Backslash-newline inside double quotes is removed by the shell, so
          # the semicolon-joined form survives both layers intact.
          echo "--- upstream agrees the paths are inside the mounts ---"
          docker compose exec -T panel /opt/venv/bin/python -c \
            "import sys, pathlib; sys.path.insert(0, '/app/src'); \
             from webui import blacklist_store as b, email_provider_store as e, proxy_store as p; \
             paths = {'blacklist': b.STATE_PATH, 'config': e.CONFIG_PATH, \
                      'proxy_pool': p.STATE_PATH, 'proxy_legacy': p.LEGACY_PATH}; \
             [print('  %-13s %s' % kv) for kv in paths.items()]; \
             bad = {k: str(v) for k, v in paths.items() \
                    if not str(pathlib.Path(v).resolve()).startswith(('/app/src/panel-data', '/app/src/log'))}; \
             sys.exit('resolved outside the mounts: %r' % bad) if bad else None; \
             sys.exit('config path is a symlink; panel saves would be lost') \
                 if pathlib.Path(e.CONFIG_PATH).is_symlink() else None; \
             print('  every state path resolves inside a mount')"

          # PANEL_INCLUDE_TAIL must be reachable from .env -- it was hardcoded
          # in compose once, so setting it in .env did nothing at all.
          echo "--- an .env override reaches the panel ---"
          printf 'PANEL_INCLUDE_TAIL=1\n' > .env
          IMAGE_TAG="reqs-${{ needs.probe.outputs.reqs_sha }}" \
            docker compose up -d --wait --wait-timeout 180
          got="$(docker compose exec -T panel printenv PANEL_INCLUDE_TAIL | tr -d '\r\n')"
          [ "$got" = 1 ] || { echo ".env PANEL_INCLUDE_TAIL=1 arrived as '$got'" >&2; exit 1; }
          body="$(docker compose exec -T panel curl -sf \
                    -H "Authorization: Bearer $token" \
                    http://127.0.0.1:8787/api/status)"
          # `if`, not `grep ... && { exit 1; }` -- see the note above.
          if printf '%s' "$body" | grep -q 'raw log tail disabled'; then
            echo "tail still disabled with PANEL_INCLUDE_TAIL=1" >&2; exit 1
          fi
          echo "the tail card is enabled from .env alone"
          rm -f .env

          docker compose down -v
          cd - >/dev/null
          rm -rf "$fresh"
