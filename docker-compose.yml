services:
  panel:
    # Built by .github/workflows/image.yml, never locally. The image carries only
    # dependencies; upstream source is git-pulled by the entrypoint at start, so
    # source-only upstream commits need a `restart`, not a `pull`.
    image: ghcr.io/murasamecyan/grok-register-panel-docker:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    # Camoufox/Firefox crashes on the default 64 MB /dev/shm.
    shm_size: 1gb
    environment:
      MONITOR_HOST: 0.0.0.0        # container-internal; publish only to 127.0.0.1 below
      MONITOR_PORT: 8787
      # Optional: unset means the entrypoint generates one on first start and
      # saves it to panel-data/monitor_token. Set it in .env to pin your own.
      MONITOR_TOKEN: ${MONITOR_TOKEN:-}
      PANEL_INCLUDE_TAIL: 0
      UPSTREAM_REF: ${UPSTREAM_REF:-main}
      UPSTREAM_AUTO_UPDATE: ${UPSTREAM_AUTO_UPDATE:-1}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Named volumes, not bind mounts, so `docker compose up -d` works with
      # nothing prepared on the host. Docker seeds a new named volume from the
      # image, inheriting uid 10001 from /app -- whereas it creates a missing
      # bind-mount source as root:root, which is what used to trap a fresh `up`
      # in a "not writable by uid 10001" restart loop.
      #
      # To put any of these somewhere you can browse or back up directly, see
      # docker-compose.bind.yml: `docker compose -f docker-compose.yml -f
      # docker-compose.bind.yml up -d`.
      #
      # panel-data holds config.json + proxies.txt (created here on first start
      # and symlinked into /app/src) plus the generated monitor_token.
      - panel-data:/app/src/panel-data
      # Credential material: the panel's own output, kept out of the container
      # layer so it survives recreate.
      - cpa_auth:/app/src/cpa_auth
      - grok2api_auth:/app/src/grok2api_auth
      - accounts:/app/src/accounts
      - log:/app/src/log
      # ponytail: .next_action_id.cache at the repo root is deliberately NOT
      # mounted. It is written with atomic_write_text (mkstemp+os.replace), so a
      # single-file mount fails EXDEV -- and the caller swallows the error, so it
      # would silently persist nothing. It survives `restart`, is lost on
      # recreate, and costs one JS-chunk scan to rebuild. Upgrade path: patch
      # upstream to honour an env var for the cache path, then mount a dir.
      - camoufox:/home/app/.cache/camoufox

volumes:
  panel-data:
  cpa_auth:
  grok2api_auth:
  accounts:
  log:
  camoufox:
